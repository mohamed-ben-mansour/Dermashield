
services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: gl_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bmm22112003
    ports:
      - '5432:5432'

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      - db
    environment:
      POSTGRES_DB: gl_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bmm22112003
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_TEST_DB: gl_test_test
volumes:
  postgres_data:
